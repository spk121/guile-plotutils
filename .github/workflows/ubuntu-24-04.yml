name: Ubuntu 24.04

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: America/Los_Angeles

jobs:
  build:
    runs-on: ubuntu-24.04

    # GitHub's "bash" shell runs with -eo pipefail.  The default for run
    # steps is "bash -e {0}", without pipefail, so "cmd | tee log" would
    # report tee's exit status and hide a failing cmd.
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v6

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y guile-3.0-dev texlive texlive-plain-generic plotutils libplot-dev

    - name: Configure
      run: |
        autoreconf -vif
        ./configure --prefix="$(pwd)/dist" 2>&1 | tee configure.log

    - name: Build
      run: make 2>&1 | tee build.log

    - name: Test
      run: make check 2>&1 | tee test.log

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: logs
        path: |
          configure.log
          config.log
          build.log
          test.log
